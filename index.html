<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>BEE STORM</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #05070f; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    box-sizing: border-box; touch-action: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 2px solid #1C2340; box-shadow: 0 0 80px rgba(79, 195, 232, .18);
  }
  #dbg { display: none; }
</style>
</head>
<body>
<canvas id="game" width="480" height="640"></canvas>
<pre id="dbg"></pre>
<script>
'use strict';
// =====================================================================
//  BEE STORM — 小蜜蜂類型原創射擊遊戲（單一 index.html + Canvas + 純 JS）
//  電腦：← → 移動　空白鍵 射擊　X 炸彈　P 暫停　M 靜音　Enter 開始
//  手機：手指左右拖曳移動、按住自動射擊、右下按鈕放炸彈、右上按鈕暫停
// =====================================================================

// 觸控裝置偵測（手機、平板）
let touchMode = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

// 畫面寬 480、高 640；手機直拿時把高度拉長填滿螢幕（最高 960）
const W = 480;
const H = (() => {
  const vw = innerWidth, vh = innerHeight;
  if (!touchMode || vh <= vw) return 640;
  return Math.round(Math.min(960, Math.max(640, W * vh / vw)));
})();
const cv = document.getElementById('game');
cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  const pad = Math.min(vw, vh) < 600 ? 0 : 20;  // 手機不留邊，畫面盡量大
  const s = Math.min((vw - pad) / W, (vh - pad) / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.style.borderWidth = pad ? '2px' : '0';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);
fit();

// 測試用網址參數：#auto（自動遊玩）、#god（無敵）、#stage=3（從第 3 關開始）
const HASH = location.hash.slice(1).split('&').reduce((o, kv) => {
  const [k, v] = kv.split('=');
  if (k) o[k] = v === undefined ? true : v;
  return o;
}, {});
const AUTO = !!HASH.auto, GOD = !!HASH.god;
const START_STAGE = Math.max(1, parseInt(HASH.stage, 10) || 1);
const errors = [];
addEventListener('error', e => errors.push(String(e.message) + ' @' + e.lineno + ':' + e.colno));

// ---------- 小工具 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const bez = (p0, p1, p2, p3, t) => {
  const u = 1 - t;
  return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
};
function prune(arr) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) if (!arr[i].dead) arr[j++] = arr[i];
  arr.length = j;
}

// ---------- 像素圖（全部用程式畫，不用外部圖片） ----------
function makeSprite(rows, pal, s) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas');
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d');
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      const col = pal[r[x]];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(x * s, y * s, s, s);
    }
  });
  return c;
}
function whiteOf(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#fff';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

const BEE_A = [
  '..k.....k..',
  '...k...k...',
  'ww.kkkkk.ww',
  'wwwkekekwww',
  '.wwyyyyyww.',
  '..kkkkkkk..',
  '..yyyyyyy..',
  '..kkkkkkk..',
  '...yyyyy...',
  '....kok....',
  '.....o.....',
];
const BEE_B = [
  '..k.....k..',
  '...k...k...',
  '...kkkkk...',
  '..wkekekw..',
  'wwwyyyyywww',
  'wwkkkkkkkww',
  '.wyyyyyyyw.',
  '..kkkkkkk..',
  '...yyyyy...',
  '....kok....',
  '.....o.....',
];
const SHIP = [
  '......w......',
  '......c......',
  '.....cwc.....',
  '.....cbc.....',
  '....ccbcc....',
  '..r.cbbbc.r..',
  '..c.cbbbc.c..',
  '.cccccbccccc.',
  'ccccccccccccc',
  'cc.ccccccc.cc',
  'c...rr.rr...c',
];
const QUEEN = [
  '........g..g..g........',
  '........ggggggg........',
  '...ww....yyyyy....ww...',
  '..wwww..kyeyeyk..wwww..',
  '.wwwwww.yyyyyyy.wwwwww.',
  'wwwwwwwwkkkkkkkwwwwwwww',
  'wwwwwwwyyyyyyyyywwwwwww',
  '.wwwww.kkkkkkkkk.wwwww.',
  '..www..yyyyyyyyy..www..',
  '.......kkkkkkkkk.......',
  '........yyyyyyy........',
  '........kkkkkkk........',
  '.........yyyyy.........',
  '..........kok..........',
  '...........o...........',
];

const PAL = {
  worker:    { k: '#3A2A10', y: '#FFC83D', w: '#BFE8F7', e: '#FFFFFF', o: '#E08A1E' },
  soldier:   { k: '#3A1010', y: '#FF6B5A', w: '#FFD9CF', e: '#FFF3C4', o: '#FFC83D' },
  guard:     { k: '#22164A', y: '#B48CFF', w: '#9FF0FF', e: '#FF5AA8', o: '#FFFFFF' },
  guardHurt: { k: '#22164A', y: '#6E58A8', w: '#5FA0B0', e: '#FF5AA8', o: '#AAAAAA' },
  bonus:     { k: '#0E3A2A', y: '#7CFFB2', w: '#E6FFF2', e: '#FFFFFF', o: '#FFC83D' },
};
const SPR = {};
for (const k in PAL) {
  const a = makeSprite(BEE_A, PAL[k], 2), b = makeSprite(BEE_B, PAL[k], 2);
  SPR[k] = [a, b];
  SPR[k + '_w'] = [whiteOf(a), whiteOf(b)];
}
const SHIP_PAL = { c: '#4FC3E8', w: '#F4F1E8', b: '#1C6F9A', r: '#FF6B5A' };
const SHIP_IMG = makeSprite(SHIP, SHIP_PAL, 2);
const SHIP_MINI = makeSprite(SHIP, SHIP_PAL, 1);
const QUEEN_IMG = makeSprite(QUEEN, { g: '#FFE066', k: '#3A1A00', y: '#FF9F1C', w: '#CFEFFF', e: '#FF2E63', o: '#FFFFFF' }, 4);
const QUEEN_RAGE = makeSprite(QUEEN, { g: '#FFE066', k: '#2A0000', y: '#FF3B3B', w: '#FFC9C9', e: '#FFFF66', o: '#FFFFFF' }, 4);
const QUEEN_W = whiteOf(QUEEN_IMG);

// 掃描線＋暗角（預先畫好）
const OVERLAY = (() => {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,0.13)';
  for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  return c;
})();

// ---------- 音效（Web Audio API 即時合成，不用音檔） ----------
let actx = null, master = null, noiseBuf = null, muted = false;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.35;
    master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}
function tone(f0, f1, dur, type = 'square', vol = 0.2, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, f0 = 1200, f1 = 100, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const s = actx.createBufferSource();
  s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter();
  fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f0, t);
  fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  shoot()   { tone(1400, 300, 0.08, 'square', 0.06); },                       // 咻
  boom()    { noise(0.3, 0.35, 2000, 120); tone(160, 40, 0.25, 'sine', 0.25); }, // 砰
  bigBoom() { noise(1.1, 0.5, 3000, 60); tone(120, 30, 1.0, 'sine', 0.4); },
  hurt()    { tone(240, 45, 0.7, 'sawtooth', 0.25); noise(0.4, 0.3, 800, 60); },  // 扣命低沉音
  clink()   { tone(1800, 1200, 0.06, 'triangle', 0.15); },
  power()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.09, 'square', 0.1, i * 0.07)); },
  dive()    { tone(1500, 380, 0.5, 'sine', 0.05); },
  clear()   { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f * 1.01, 0.14, 'square', 0.1, i * 0.1)); },
  start()   { [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.15, i * 0.09)); },
  over()    { [523, 440, 349, 262].forEach((f, i) => tone(f, f * 0.98, 0.32, 'triangle', 0.18, i * 0.26)); },
  warning() { for (let i = 0; i < 3; i++) tone(880, 440, 0.3, 'sawtooth', 0.12, i * 0.4); },
  charge()  { tone(200, 1200, 0.9, 'sawtooth', 0.06); },
  laser()   { noise(0.7, 0.25, 4000, 800); tone(90, 60, 0.7, 'sawtooth', 0.15); },
  fan()     { tone(600, 200, 0.15, 'square', 0.08); },
  bomb()    { noise(1.0, 0.5, 5000, 80); tone(80, 30, 0.9, 'sine', 0.4); },
  shield()  { tone(900, 1800, 0.2, 'triangle', 0.15); },
  bossHit() { tone(320, 200, 0.05, 'square', 0.05); },
};

// ---------- 遊戲狀態 ----------
const FONT_EN = 'Consolas, "Courier New", monospace';
const FONT_TC = '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';

const MODS = [
  { id: 'frenzy', name: '狂暴俯衝', desc: '俯衝頻率 ×2' },
  { id: 'armor',  name: '裝甲蜂隊', desc: '前兩排要打兩下' },
  { id: 'meteor', name: '流星雨',   desc: '小心天上掉下來的石頭' },
  { id: 'swift',  name: '疾風蜂群', desc: '隊形移動更快' },
  { id: 'sniper', name: '狙擊蜂',   desc: '子彈會瞄準你' },
];
const DROPS = {
  D: { c: '#FFC83D', label: 'D',   name: '雙發子彈！' },
  R: { c: '#FF6B5A', label: 'R',   name: '連射！' },
  S: { c: '#4FC3E8', label: 'S',   name: '護盾！' },
  B: { c: '#FF9F1C', label: 'B',   name: '蜂蜜炸彈 +1' },
  L: { c: '#7CFFB2', label: '1UP', name: '多一條命！' },
};

let state = 'title';       // title / play / over
let phase = 'normal';      // normal / boss / bonus / clear / dying
let stage = 1, score = 0, lives = 3, bombs = 1;
let hi = 0;
try { hi = parseInt(localStorage.getItem('beestorm_hi'), 10) || 0; } catch (e) { hi = 0; }
let newRecord = false;

let player = null;
const bullets = [], ebullets = [], enemies = [], parts = [], rings = [], texts = [], drops = [], meteors = [];
let boss = null, bonus = null, bombWave = null, banner = null, mod = null;
let fx = 0, fdir = 1;
let diveTimer = 0, fireTimer = 0, meteorTimer = 0;
let shake = 0, flashA = 0, flashC = '#fff', hitStop = 0, slowMo = 0, warp = 0;
let combo = 0, comboT = 0, comboPop = 0;
let clearT = 0, clearDur = 2, dyingT = 0, overT = 0;
let T = 0, paused = false;
const stats = { kills: 0, maxStage: 1, games: 0 };

const speedMul = () => Math.min(Math.pow(1.2, stage - 1), 4);

function addScore(n) { score += n; }

function newPlayer() {
  return { x: W / 2, y: H - 56, cd: 0, inv: 0, double: 0, rapid: 0, shield: false, dead: false, tilt: 0 };
}

function startGame() {
  score = 0; lives = 3; bombs = 1; stage = START_STAGE; newRecord = false;
  player = newPlayer();
  state = 'play'; paused = false;
  parts.length = 0; rings.length = 0; texts.length = 0;
  stats.games++;
  startStage();
  sfx.start();
}

function resetField() {
  bullets.length = 0; ebullets.length = 0; drops.length = 0; meteors.length = 0; enemies.length = 0;
  boss = null; bonus = null; bombWave = null;
}

function startStage() {
  resetField();
  fx = 0; fdir = 1; combo = 0; comboT = 0;
  diveTimer = 3.5; fireTimer = 2.5; meteorTimer = 2;
  mod = null;
  stats.maxStage = Math.max(stats.maxStage, stage);
  const isBoss = stage % 3 === 0;
  const isBonus = !isBoss && stage % 4 === 0;
  if (isBoss) {
    phase = 'boss';
    spawnBoss();
    banner = { text: 'WARNING', sub: `STAGE ${stage}　蜂后來襲！`, t: 0, dur: 2.4, color: '#FF5A5A' };
    sfx.warning();
  } else if (isBonus) {
    phase = 'bonus';
    bonus = { hits: 0, total: 40, wave: 0, waveT: 1.8, done: false };
    banner = { text: 'BONUS STAGE', sub: '蜂蜜時間：牠們不會攻擊，全部打下來！', t: 0, dur: 2.4, color: '#7CFFB2' };
  } else {
    phase = 'normal';
    if (stage >= 2) mod = stage === 2 ? MODS[0] : MODS[(stage * 7) % MODS.length];
    spawnFormation();
    banner = { text: 'STAGE ' + stage, sub: mod ? `${mod.name}：${mod.desc}` : '打倒所有蜜蜂！', t: 0, dur: 2.2, color: '#FFC83D' };
  }
}

// ---------- 蜜蜂隊形 ----------
function spawnFormation() {
  const armor = mod && mod.id === 'armor';
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 8; c++) {
      let type;
      if (r === 0) type = stage >= 2 ? 'guard' : 'soldier';
      else if (r === 1) type = armor ? 'guard' : 'soldier';
      else type = 'worker';
      const left = c < 4;
      enemies.push({
        type, skin: null, hp: type === 'guard' ? 2 : 1, col: c, row: r,
        x: -999, y: -999, state: 'enter',
        t: -((3 - r) * 0.55 + (c % 4) * 0.09 + (left ? 0 : 0.25)),
        side: left ? -1 : 1, ang: 0, flash: 0, vx: 0, vy: 0, dt: 0,
        pat: null, shots: 0, hidden: true,
      });
    }
  }
}

function slotPos(e) {
  const br = stage >= 5 ? 1 + 0.07 * Math.sin(T * 2) : 1;  // 第 5 關起隊形會「呼吸」
  return { x: W / 2 + (e.col - 3.5) * 44 * br + fx, y: 84 + e.row * 36 + Math.sin(T * 3 + e.col) * 2 };
}

function startDive(e, pat, delay = 0) {
  e.state = 'dive';
  e.dt = -delay;
  e.pat = pat || pick(e.type === 'soldier' ? ['kamikaze', 'zigzag', 'swoop']
                    : e.type === 'guard' ? ['loop', 'swoop'] : ['swoop', 'zigzag', 'loop']);
  e.side = e.x < W / 2 ? -1 : 1;
  e.vx = 0; e.vy = 0; e.shots = 0; e.looping = 0; e.looped = false;
  e.x0 = clamp(e.x, 140, W - 140);
  sfx.dive();
}

function updateDive(e, dt, spd) {
  e.dt += dt;
  if (e.dt < 0) { const s = slotPos(e); e.x = s.x; e.y = s.y; return; }
  const vmax = (150 + 30 * Math.min(spd, 3)) * (e.pat === 'kamikaze' ? 1.35 : 1);
  if (e.dt < 0.5) {
    // 脫隊：先往上、往外繞一個鉤
    const a = (e.dt / 0.5) * Math.PI;
    e.vx = e.side * 110 * Math.sin(a);
    e.vy = -130 * Math.cos(a);
  } else if (e.pat === 'loop' && !e.looped && e.y > 260) {
    // 空中翻一圈
    e.looping += dt;
    const sp = Math.hypot(e.vx, e.vy) || vmax;
    const ang = Math.atan2(e.vy, e.vx) + (Math.PI * 2 / 1.1) * dt * -e.side;
    e.vx = Math.cos(ang) * sp; e.vy = Math.sin(ang) * sp;
    if (e.looping > 1.1) e.looped = true;
  } else {
    let tx;
    if (e.pat === 'zigzag') tx = e.x0 + Math.sin(e.dt * 4) * 130;
    else tx = player.x + (e.pat === 'swoop' ? Math.sin(e.dt * 2.2) * 70 : 0);
    tx = clamp(tx, 16, W - 16);
    const k = e.pat === 'kamikaze' ? 5 : 3;
    e.vx += clamp((tx - e.x) * k - e.vx * 1.5, -700, 700) * dt;
    e.vy += (vmax - e.vy) * 2 * dt;
  }
  e.x += e.vx * dt; e.y += e.vy * dt;
  e.ang = Math.atan2(e.vy, e.vx) - Math.PI / 2;
  if (Math.random() < 0.35) parts.push({ x: e.x, y: e.y, vx: 0, vy: 0, t: 0, life: 0.3, c: PAL[e.skin || e.type].y, sz: 2, type: 'trail' });

  // 俯衝中開火
  const maxShots = stage >= 4 ? 2 : 1;
  if (phase === 'normal' && e.shots < maxShots && e.dt > 0.6 + e.shots * 0.45 && e.y > 0 && e.y < player.y - 140) {
    e.shots++;
    fireAt(e.x, e.y + 10, player.x, player.y, 170 + 10 * Math.min(stage, 10));
  }
  if (e.y > H + 30) {
    if (e.temp) e.dead = true;
    else { e.y = -30; e.x = slotPos(e).x; e.state = 'return'; }
  }
}

function fireAt(x, y, tx, ty, v) {
  if (ebullets.length > 60) return;
  const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
  ebullets.push({ x, y, vx: dx / d * v, vy: dy / d * v, r: 3, c: '#FF6B5A' });
}

function updateEnemies(dt) {
  const spd = speedMul();
  const swift = mod && mod.id === 'swift' ? 1.6 : 1;
  fx += fdir * 40 * spd * swift * dt;
  if (fx > 56) { fx = 56; fdir = -1; }
  if (fx < -56) { fx = -56; fdir = 1; }

  let entering = false, diving = 0;
  for (const e of enemies) {
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    if (e.state === 'path') { updatePathEnemy(e, dt); continue; }
    const s = slotPos(e);
    if (e.state === 'enter') {
      entering = true;
      e.t += dt;
      if (e.t < 0) { e.hidden = true; continue; }
      e.hidden = false;
      const p = Math.min(1, e.t / 1.5);
      const sx = e.side < 0 ? -30 : W + 30, sy = 430 - e.row * 24;
      const nx = bez(sx, e.side < 0 ? 360 : W - 360, e.side < 0 ? 120 : W - 120, s.x, p);
      const ny = bez(sy, 470, -60, s.y, p);
      if (e.x > -500) e.ang = Math.atan2(ny - e.y, nx - e.x) - Math.PI / 2;
      e.x = nx; e.y = ny;
      if (p >= 1) { e.state = 'form'; }
    } else if (e.state === 'form') {
      e.x = s.x; e.y = s.y; e.ang *= 0.85;
    } else if (e.state === 'dive') {
      diving++;
      updateDive(e, dt, spd);
    } else if (e.state === 'return') {
      diving++;
      const dx = s.x - e.x, dy = s.y - e.y, d = Math.hypot(dx, dy);
      const v = 200 * Math.min(spd, 2);
      if (d < v * dt + 2) { e.state = 'form'; e.x = s.x; e.y = s.y; }
      else { e.x += dx / d * v * dt; e.y += dy / d * v * dt; e.ang = Math.atan2(dy, dx) - Math.PI / 2; }
    }
  }

  if (phase !== 'normal' || entering) return;

  // 每 2–3 秒挑一隻俯衝（後面的關卡更頻繁）
  diveTimer -= dt;
  const alive = enemies.filter(e => !e.dead);
  const maxDive = Math.min(6, 2 + Math.floor(stage / 2)) + (alive.length <= 4 ? 2 : 0);
  if (diveTimer <= 0) {
    const mult = (mod && mod.id === 'frenzy' ? 2 : 1) * (1 + 0.12 * (stage - 1)) * (alive.length <= 4 ? 2 : 1);
    diveTimer = Math.max(0.5, rand(2, 3) / mult);
    const cands = alive.filter(e => e.state === 'form');
    if (cands.length && diving < maxDive) {
      const lead = pick(cands);
      startDive(lead);
      // 裝甲蜂俯衝時會帶護衛
      if (lead.type === 'guard') {
        for (const e of cands) {
          if (e !== lead && e.row === lead.row + 1 && Math.abs(e.col - lead.col) === 1 && Math.random() < 0.8) {
            startDive(e, lead.pat, 0.15);
          }
        }
      }
    }
  }

  // 隊形中的蜜蜂往下射
  fireTimer -= dt;
  if (fireTimer <= 0) {
    fireTimer = rand(0.8, 1.6) / (1 + 0.15 * (stage - 1));
    const f = alive.filter(e => e.state === 'form');
    if (f.length) {
      const s = pick(f);
      if (mod && mod.id === 'sniper') fireAt(s.x, s.y + 10, player.x, player.y, 190);
      else if (ebullets.length < 60) ebullets.push({ x: s.x, y: s.y + 10, vx: 0, vy: 150 + 12 * Math.min(stage, 12), r: 3, c: '#FF6B5A' });
    }
  }
}

// ---------- 獎勵關 ----------
const BONUS_PATHS = [
  u => ({ x: -30 + u * 540, y: 110 + Math.sin(u * Math.PI * 3) * 60 }),
  u => ({ x: W + 30 - u * 540, y: 220 + Math.sin(u * Math.PI * 3) * 60 }),
  u => ({ x: W / 2 + Math.sin(u * Math.PI * 4) * 150, y: -30 + u * 700 }),
  u => ({ x: -30 + u * 540, y: -30 + u * 500 + Math.sin(u * 10) * 30 }),
  u => {
    if (u < 0.25) return { x: lerp(-30, W / 2, u / 0.25), y: 110 };
    if (u < 0.75) {
      const a = ((u - 0.25) / 0.5) * Math.PI * 2 - Math.PI / 2;
      return { x: W / 2 + Math.cos(a) * 140, y: 250 + Math.sin(a) * 140 };
    }
    return { x: lerp(W / 2, W + 30, (u - 0.75) / 0.25), y: 110 };
  },
];

function updateBonus(dt) {
  bonus.waveT -= dt;
  if (bonus.wave < BONUS_PATHS.length && bonus.waveT <= 0) {
    const path = BONUS_PATHS[bonus.wave];
    for (let i = 0; i < 8; i++) {
      enemies.push({ type: 'bonus', skin: null, hp: 1, state: 'path', path, pt: -i * 0.16, dur: 3.6,
                     x: -999, y: -999, ang: 0, flash: 0, hidden: true, col: i });
    }
    bonus.wave++;
    bonus.waveT = 3.0;
  }
  if (!bonus.done && bonus.wave >= BONUS_PATHS.length && enemies.length === 0) {
    bonus.done = true;
    const perfect = bonus.hits === bonus.total;
    if (perfect) addScore(10000);
    stageClear({
      text: perfect ? 'PERFECT!' : 'BONUS RESULT',
      sub: `命中 ${bonus.hits} / ${bonus.total}` + (perfect ? '　+10000' : ''),
      t: 0, dur: 2.6, color: '#7CFFB2',
    });
  }
}

function updatePathEnemy(e, dt) {
  e.pt += dt;
  if (e.pt < 0) { e.hidden = true; return; }
  e.hidden = false;
  const u = e.pt / e.dur;
  if (u >= 1) { e.dead = true; return; }
  const p = e.path(u);
  if (e.x > -500) e.ang = Math.atan2(p.y - e.y, p.x - e.x) - Math.PI / 2;
  e.x = p.x; e.y = p.y;
}

// ---------- 蜂后 BOSS ----------
function spawnBoss() {
  const n = Math.floor(stage / 3);
  const hp = 60 + (n - 1) * 25;
  boss = { x: W / 2, y: -80, hp, max: hp, t: 0, atk: 2.5, mode: 'enter', flash: 0,
           laser: null, spiral: 0, spiralAcc: 0, dead: false, deathT: 0 };
}

function updateBoss(dt) {
  const b = boss;
  b.t += dt;
  b.flash = Math.max(0, b.flash - dt);
  if (b.dead) {
    b.deathT += dt;
    if (Math.random() < 0.45) {
      const x = b.x + rand(-44, 44), y = b.y + rand(-28, 28);
      explode(x, y, pick(['#FF9F1C', '#FFE066', '#FFFFFF']), 14);
      sfx.boom();
      shake = Math.max(shake, 6);
    }
    if (b.deathT > 1.8) {
      explode(b.x, b.y, '#FFE066', 80);
      rings.push({ x: b.x, y: b.y, r: 10, max: 260, t: 0, life: 0.8, c: '#FFE066', w: 6 });
      boss = null;
      stageClear();
    }
    return;
  }
  if (b.mode === 'enter') {
    b.y = lerp(b.y, 130, dt * 1.5);
    if (b.y > 125) b.mode = 'fight';
    return;
  }
  const rage = b.hp < b.max / 2;
  if (!b.laser) b.x = W / 2 + Math.sin(b.t * (rage ? 1.1 : 0.7)) * 150;
  b.y = 130 + Math.sin(b.t * 1.7) * 12;

  b.atk -= dt;
  if (b.atk <= 0 && !b.laser && b.spiral <= 0) {
    const a = pick(['fan', 'summon', 'sting', 'spiral']);
    if (a === 'fan') {
      const n = rage ? 11 : 7;
      for (let i = 0; i < n; i++) {
        const ang = Math.PI / 2 + (i - (n - 1) / 2) * 0.16;
        ebullets.push({ x: b.x, y: b.y + 30, vx: Math.cos(ang) * 170, vy: Math.sin(ang) * 170, r: 4, c: '#FF9F1C' });
      }
      sfx.fan();
    } else if (a === 'summon') {
      const n = rage ? 4 : 3;
      for (let i = 0; i < n; i++) {
        enemies.push({ type: i % 2 ? 'soldier' : 'worker', skin: null, hp: 1, state: 'dive', temp: true,
                       x: b.x + (i - (n - 1) / 2) * 30, y: b.y + 20, ang: 0, flash: 0, vx: 0, vy: 60,
                       dt: 0.5, pat: 'kamikaze', side: i % 2 ? 1 : -1, shots: 9, looping: 0, looped: true,
                       x0: b.x, hidden: false, col: i, row: 0 });
      }
      sfx.dive();
    } else if (a === 'sting') {
      b.laser = { t: 0, x: b.x, fired: false };
      sfx.charge();
    } else {
      b.spiral = 1.6;
    }
    b.atk = rage ? rand(1.2, 1.8) : rand(1.8, 2.6);
  }

  if (b.spiral > 0) {
    b.spiral -= dt;
    b.spiralAcc += dt;
    while (b.spiralAcc > 0.07) {
      b.spiralAcc -= 0.07;
      const ang = b.t * 5;
      for (const off of [0, Math.PI]) {
        const a2 = ang + off;
        ebullets.push({ x: b.x, y: b.y + 20, vx: Math.cos(a2) * 140, vy: Math.abs(Math.sin(a2)) * 140 + 40, r: 3, c: '#FF5AA8' });
      }
    }
  }

  if (b.laser) {
    const l = b.laser;
    l.t += dt;
    if (l.t > 0.9 && !l.fired) { l.fired = true; sfx.laser(); shake = Math.max(shake, 6); }
    if (l.t > 0.9 && l.t < 1.6) {
      shake = Math.max(shake, 2);
      if (Math.abs(player.x - l.x) < 24) hurtPlayer();
      if (Math.random() < 0.6) parts.push({ x: l.x + rand(-12, 12), y: H - rand(0, 30), vx: rand(-80, 80), vy: rand(-200, -60), t: 0, life: 0.4, c: '#FFD0D0', sz: 2, type: 'spark' });
    }
    if (l.t >= 1.6) b.laser = null;
  }
}

function damageBoss(n) {
  const b = boss;
  if (!b || b.dead || b.mode !== 'fight') return;
  b.hp -= n;
  b.flash = 0.06;
  addScore(10 * n);
  sfx.bossHit();
  if (b.hp <= 0) {
    b.hp = 0;
    b.dead = true;
    b.laser = null; b.spiral = 0;
    ebullets.length = 0;
    hitStop = 0.25; slowMo = 1.2; shake = 14;
    flashA = 0.8; flashC = '#FFFFFF';
    addScore(5000);
    texts.push({ x: b.x, y: b.y, s: '+5000', c: '#FFE066', t: 0, big: true });
    spawnDrop(b.x - 30, b.y); spawnDrop(b.x + 30, b.y);
    sfx.bigBoom();
    stats.kills++;
  }
}

// ---------- 玩家 ----------
function hurtPlayer() {
  if (!player || player.inv > 0 || player.dead || GOD || phase === 'clear') return;
  if (player.shield) {
    player.shield = false;
    player.inv = 1;
    rings.push({ x: player.x, y: player.y, r: 16, max: 70, t: 0, life: 0.4, c: '#4FC3E8', w: 4 });
    sfx.shield();
    return;
  }
  lives--;
  sfx.hurt();
  buzz(lives <= 0 ? [80, 60, 200] : 120);
  shake = 10; flashA = 0.45; flashC = '#FF3B3B';
  explode(player.x, player.y, '#4FC3E8', 30);
  player.double = 0; player.rapid = 0;
  if (lives <= 0) {
    phase = 'dying'; dyingT = 0; player.dead = true;
    explode(player.x, player.y, '#FFFFFF', 60);
    rings.push({ x: player.x, y: player.y, r: 10, max: 160, t: 0, life: 0.7, c: '#4FC3E8', w: 5 });
    sfx.bigBoom();
  } else {
    player.inv = 2;  // 閃爍 2 秒無敵
  }
}

function aiControl() {
  // 自動遊玩（只在網址加 #auto 時使用）
  let dir = 0;
  const danger = ebullets.find(b => b.y < player.y && b.y > player.y - 140 && Math.abs(b.x + b.vx * 0.3 - player.x) < 22);
  const crash = enemies.find(e => !e.hidden && (e.state === 'dive' || e.state === 'path') && e.y > player.y - 160 && e.y < player.y + 10 && Math.abs(e.x - player.x) < 34);
  const threat = danger || crash;
  if (threat) dir = threat.x > player.x ? -1 : 1;
  else {
    let tx = W / 2, best = 1e9;
    for (const e of enemies) {
      if (e.hidden || e.dead) continue;
      const d = Math.abs(e.x - player.x) + (e.state === 'dive' ? -60 : 0);
      if (d < best) { best = d; tx = e.x; }
    }
    if (boss && !boss.dead) tx = boss.laser ? (boss.laser.x > W / 2 ? 80 : W - 80) : boss.x;
    if (Math.abs(tx - player.x) > 6) dir = tx > player.x ? 1 : -1;
  }
  if (player.x < 30) dir = 1;
  if (player.x > W - 30) dir = -1;
  if (lives === 1 && bombs > 0 && danger) useBomb();
  return { dir, fire: true };
}

function updatePlayer(dt) {
  const p = player;
  if (p.dead) return;
  let dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let fire = !!keys.Space;
  if (AUTO) { const a = aiControl(); dir = a.dir; fire = a.fire; }
  p.x = clamp(p.x + dir * 260 * dt, 16, W - 16);
  // 觸控：手指拖多少，飛船就跟著移多少；手指按著就自動射擊
  if (touch.dx) {
    p.x = clamp(p.x + touch.dx, 16, W - 16);
    dir = clamp(touch.dx / 3, -1, 1);
    touch.dx = 0;
  }
  if (touch.id !== null) fire = true;
  p.tilt = lerp(p.tilt, dir, dt * 10);
  p.cd -= dt;
  p.inv = Math.max(0, p.inv - dt);
  p.double = Math.max(0, p.double - dt);
  p.rapid = Math.max(0, p.rapid - dt);

  if (fire && p.cd <= 0 && phase !== 'clear') {
    const vol = p.double > 0 ? 2 : 1;
    const maxB = (p.rapid > 0 ? 5 : 3) * vol;  // 同時最多 3 發（道具可增加）
    if (bullets.length + vol <= maxB) {
      if (vol === 2) {
        bullets.push({ x: p.x - 7, y: p.y - 12 }, { x: p.x + 7, y: p.y - 12 });
      } else {
        bullets.push({ x: p.x, y: p.y - 14 });
      }
      p.cd = p.rapid > 0 ? 0.09 : 0.16;
      sfx.shoot();
      for (let i = 0; i < 4; i++) parts.push({ x: p.x, y: p.y - 14, vx: rand(-60, 60), vy: rand(-140, -40), t: 0, life: 0.15, c: '#FFF3C4', sz: 2, type: 'spark' });
    }
  }
}

function useBomb() {
  if (state !== 'play' || paused || bombs <= 0 || !player || player.dead || phase === 'clear' || phase === 'dying' || bombWave) return;
  bombs--;
  bombWave = { x: player.x, y: player.y, r: 0, bossHit: false };
  ebullets.length = 0;
  flashA = 0.6; flashC = '#FFE066';
  shake = 12;
  sfx.bomb();
}

function updateBomb(dt) {
  const w = bombWave;
  w.r += 700 * dt;
  for (const e of enemies) {
    if (e.dead || e.hidden) continue;
    if (Math.hypot(e.x - w.x, e.y - w.y) < w.r) { e.hp = 1; hitEnemy(e); }
  }
  for (const m of meteors) {
    if (!m.dead && Math.hypot(m.x - w.x, m.y - w.y) < w.r) { m.hp = 0; killMeteor(m); }
  }
  if (boss && !w.bossHit && Math.hypot(boss.x - w.x, boss.y - w.y) < w.r) { w.bossHit = true; damageBoss(15); }
  if (w.r > 760) bombWave = null;
}

// ---------- 擊中、爆炸、道具 ----------
function hitEnemy(e, crashed = false) {
  if (e.dead) return;
  e.hp--;
  if (e.hp > 0) {
    e.flash = 0.1;
    e.skin = 'guardHurt';
    sfx.clink();
    for (let i = 0; i < 6; i++) parts.push({ x: e.x, y: e.y, vx: rand(-120, 120), vy: rand(-120, 40), t: 0, life: 0.25, c: '#FFFFFF', sz: 2, type: 'spark' });
    return;
  }
  e.dead = true;
  stats.kills++;
  const diving = e.state === 'dive' || e.state === 'return';
  const color = PAL[e.type].y;
  explode(e.x, e.y, color, diving ? 26 : 18);
  sfx.boom();
  shake = Math.max(shake, diving ? 4 : 2);
  if (crashed) return;

  const pts = diving ? 200 : 100;  // 隊形中 100、俯衝中 200
  combo = comboT > 0 ? combo + 1 : 1;
  comboT = 1.0;
  const cb = combo >= 3 ? (combo - 2) * 20 : 0;
  if (combo >= 3) comboPop = 1;
  addScore(pts + cb);
  texts.push({ x: e.x, y: e.y, s: '+' + pts, c: diving ? '#FFC83D' : '#FFFFFF', t: 0 });
  if (bonus && e.type === 'bonus') bonus.hits++;

  if (phase === 'normal' || phase === 'boss') {
    const ch = e.type === 'guard' ? 0.22 : 0.07;
    if (Math.random() < ch) spawnDrop(e.x, e.y);
  }
  if (phase === 'normal' && !enemies.some(x => !x.dead)) {
    slowMo = 0.9;  // 最後一隻：慢動作
    rings.push({ x: e.x, y: e.y, r: 10, max: 120, t: 0, life: 0.6, c: '#FFFFFF', w: 3 });
  }
}

function explode(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 280);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.3, 0.8),
                 c: Math.random() < 0.3 ? '#FFFFFF' : color, sz: rand(1.5, 3.5), type: 'spark' });
  }
  for (let i = 0; i < 4; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 140);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, t: 0, life: rand(0.5, 1.0),
                 c: color, sz: rand(3, 5), type: 'debris', rot: rand(0, 6), vr: rand(-10, 10) });
  }
  rings.push({ x, y, r: 4, max: 36, t: 0, life: 0.35, c: color, w: 2 });
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}

function spawnDrop(x, y) {
  const pool = ['D', 'D', 'D', 'R', 'R', 'R', 'S', 'S', 'S', 'B', 'B'];
  if (lives < 5 && Math.random() < 0.25) pool.push('L');
  drops.push({ x, y, k: pick(pool), t: 0 });
}

function applyDrop(k) {
  const p = player;
  if (k === 'D') p.double = 12;
  else if (k === 'R') p.rapid = 10;
  else if (k === 'S') p.shield = true;
  else if (k === 'B') bombs = Math.min(bombs + 1, 5);
  else if (k === 'L') lives = Math.min(lives + 1, 5);
  sfx.power();
  texts.push({ x: p.x, y: p.y - 30, s: DROPS[k].name, c: DROPS[k].c, t: 0, tc: true });
  rings.push({ x: p.x, y: p.y, r: 10, max: 50, t: 0, life: 0.3, c: DROPS[k].c, w: 3 });
}

function killMeteor(m) {
  m.dead = true;
  explode(m.x, m.y, '#A08870', 14);
  addScore(50);
  texts.push({ x: m.x, y: m.y, s: '+50', c: '#C9B8A0', t: 0 });
  sfx.boom();
}

// ---------- 關卡流程 ----------
function stageClear(customBanner) {
  phase = 'clear';
  clearT = 0;
  bullets.length = 0;
  ebullets.length = 0;  // 進下一關前清空子彈
  for (const e of enemies) if (!e.dead && !e.hidden) explode(e.x, e.y, PAL[e.type].y, 10);
  enemies.length = 0;
  meteors.length = 0;
  banner = customBanner || { text: 'STAGE CLEAR', sub: '準備進入下一關…', t: 0, dur: 2, color: '#4FC3E8' };
  clearDur = banner.dur;
  sfx.clear();
}

// ---------- 主更新 ----------
function update(dt) {
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  comboT = Math.max(0, comboT - dt);
  if (comboT === 0) combo = 0;

  if (phase === 'clear') {
    clearT += dt;
    updatePlayer(dt);
    updateDrops(dt);
    if (clearT >= clearDur) { stage++; startStage(); }
    return;
  }
  if (phase === 'dying') {
    dyingT += dt;
    updateEnemies(dt);
    if (dyingT > 1.6) gameOver();
    return;
  }

  updatePlayer(dt);
  updateEnemies(dt);
  if (phase === 'bonus') updateBonus(dt);
  if (phase === 'boss' && boss) updateBoss(dt);
  if (bombWave) updateBomb(dt);
  if (phase === 'clear') return;  // 炸彈或 boss 可能剛觸發過關

  // 流星雨
  if (mod && mod.id === 'meteor') {
    meteorTimer -= dt;
    if (meteorTimer <= 0) {
      meteorTimer = rand(0.8, 1.5);
      const r = rand(10, 18), pts = [];
      for (let i = 0; i < 8; i++) pts.push(r * rand(0.7, 1.1));
      meteors.push({ x: rand(20, W - 20), y: -30, vy: rand(110, 190), vx: rand(-30, 30), r, pts, rot: 0, vr: rand(-3, 3), hp: 3, flash: 0 });
    }
  }
  for (const m of meteors) {
    m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vr * dt;
    m.flash = Math.max(0, m.flash - dt);
    if (m.y > H + 40) m.dead = true;
    if (!m.dead && Math.hypot(m.x - player.x, m.y - player.y) < m.r + 9) { m.dead = true; explode(m.x, m.y, '#A08870', 10); hurtPlayer(); }
  }

  // 玩家子彈
  for (const b of bullets) {
    b.y -= 520 * dt;
    if (b.y < -20) { b.dead = true; continue; }
    for (const e of enemies) {
      if (e.dead || e.hidden) continue;
      if (Math.abs(b.x - e.x) < 11 && Math.abs(b.y - e.y) < 11) { b.dead = true; hitEnemy(e); break; }
    }
    if (!b.dead && boss && !boss.dead && boss.mode === 'fight' && Math.abs(b.x - boss.x) < 44 && Math.abs(b.y - boss.y) < 28) {
      b.dead = true;
      damageBoss(1);
      for (let i = 0; i < 3; i++) parts.push({ x: b.x, y: b.y, vx: rand(-100, 100), vy: rand(-40, 80), t: 0, life: 0.2, c: '#FFE066', sz: 2, type: 'spark' });
    }
    if (!b.dead) {
      for (const m of meteors) {
        if (m.dead) continue;
        if (Math.hypot(b.x - m.x, b.y - m.y) < m.r + 3) {
          b.dead = true; m.hp--; m.flash = 0.08;
          if (m.hp <= 0) killMeteor(m);
          break;
        }
      }
    }
  }

  // 敵人子彈
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 10 || b.y < -20 || b.x < -10 || b.x > W + 10) { b.dead = true; continue; }
    if (!player.dead && Math.abs(b.x - player.x) < 8 && Math.abs(b.y - player.y) < 10) {
      b.dead = true;
      hurtPlayer();
    }
  }

  // 蜜蜂撞到玩家
  if (phase !== 'bonus') {
    for (const e of enemies) {
      if (e.dead || e.hidden || e.state === 'enter') continue;
      if (Math.abs(e.x - player.x) < 18 && Math.abs(e.y - player.y) < 16) {
        const before = player.inv;
        hurtPlayer();
        if (before === 0 || GOD) { e.hp = 1; hitEnemy(e, true); }
      }
    }
    if (boss && !boss.dead && Math.abs(boss.x - player.x) < 50 && Math.abs(boss.y - player.y) < 34) hurtPlayer();
  }

  updateDrops(dt);

  prune(bullets); prune(ebullets); prune(enemies); prune(meteors);

  if (phase === 'normal' && enemies.length === 0) stageClear();
}

function updateDrops(dt) {
  for (const d of drops) {
    d.t += dt;
    d.y += 80 * dt;
    if (d.y > H + 20) d.dead = true;
    else if (player && !player.dead && Math.abs(d.x - player.x) < 20 && Math.abs(d.y - player.y) < 20) {
      d.dead = true;
      applyDrop(d.k);
    }
  }
  prune(drops);
}

function gameOver() {
  state = 'over';
  overT = 0;
  if (score > hi) {
    hi = score; newRecord = true;
    try { localStorage.setItem('beestorm_hi', String(hi)); } catch (e) { /* 無痕模式存不了也沒關係 */ }
  }
  sfx.over();
}

// ---------- 背景與粒子（任何畫面都會動） ----------
const stars = [];
for (let i = 0; i < 120; i++) {
  const l = i % 3;
  stars.push({ x: rand(0, W), y: rand(0, H), l, sp: [18, 45, 95][l], c: pick(['#FFFFFF', '#BFE8F7', '#FFE7A3']) });
}

function updateAmbient(dt) {
  const warpTarget = state === 'play' && phase === 'clear' ? 1 : 0;
  warp = lerp(warp, warpTarget, dt * 3);
  for (const s of stars) {
    s.y += s.sp * (1 + warp * 8) * dt;
    if (s.y > H) { s.y -= H; s.x = rand(0, W); }
  }
  for (const p of parts) {
    p.t += dt;
    if (p.t >= p.life) { p.dead = true; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt;
    if (p.type === 'debris') { p.vy += 300 * dt; p.rot += p.vr * dt; }
  }
  prune(parts);
  for (const r of rings) { r.t += dt; if (r.t >= r.life) r.dead = true; }
  prune(rings);
  for (const t of texts) { t.t += dt; if (t.t > (t.big ? 1.5 : 0.8)) t.dead = true; }
  prune(texts);
  shake = Math.max(0, shake - 30 * dt);
  flashA = Math.max(0, flashA - dt * 2);
  comboPop = Math.max(0, comboPop - dt * 4);
  if (state === 'over') overT += dt;
}

// ---------- 繪圖 ----------
function drawBackground() {
  ctx.fillStyle = '#05070f';
  ctx.fillRect(0, 0, W, H);
  // 星雲
  const n1 = ctx.createRadialGradient(120 + Math.sin(T * 0.1) * 40, 200, 0, 120, 200, 260);
  n1.addColorStop(0, 'rgba(90,60,160,0.20)');
  n1.addColorStop(1, 'rgba(90,60,160,0)');
  ctx.fillStyle = n1; ctx.fillRect(0, 0, W, H);
  const n2 = ctx.createRadialGradient(380, 470 + Math.cos(T * 0.08) * 40, 0, 380, 470, 240);
  n2.addColorStop(0, 'rgba(30,110,160,0.18)');
  n2.addColorStop(1, 'rgba(30,110,160,0)');
  ctx.fillStyle = n2; ctx.fillRect(0, 0, W, H);
  // 三層星空
  for (const s of stars) {
    ctx.fillStyle = s.c;
    ctx.globalAlpha = 0.35 + s.l * 0.3;
    if (warp > 0.05) {
      ctx.fillRect(s.x, s.y, 1, 1 + s.sp * warp * 0.3);
    } else {
      const sz = s.l === 2 ? 2 : 1;
      ctx.fillRect(s.x, s.y, sz, sz);
    }
  }
  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  if (e.hidden || e.dead) return;
  const key = e.skin || e.type;
  const fr = Math.floor(T * 6 + (e.col || 0)) % 2;
  const img = (e.flash > 0 ? SPR[key + '_w'] : SPR[key])[fr];
  ctx.save();
  ctx.translate(Math.round(e.x), Math.round(e.y));
  if (e.ang) ctx.rotate(e.ang);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

function drawBoss() {
  const b = boss;
  const img = b.flash > 0 ? QUEEN_W : (b.hp < b.max / 2 ? QUEEN_RAGE : QUEEN_IMG);
  const wob = b.dead ? rand(-3, 3) : 0;
  ctx.drawImage(img, Math.round(b.x - img.width / 2 + wob), Math.round(b.y - img.height / 2));
  // 雷射
  if (b.laser) {
    const l = b.laser;
    if (l.t < 0.9) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(l.t * 40);
      ctx.fillStyle = '#FF3B3B';
      ctx.fillRect(l.x - 1, b.y + 30, 2, H);
      ctx.font = `bold 20px ${FONT_EN}`;
      ctx.textAlign = 'center';
      ctx.fillText('!', l.x, H - 40);
      ctx.globalAlpha = 1;
    } else if (l.t < 1.6) {
      const k = 1 - (l.t - 0.9) / 0.7;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,60,60,${0.5 * k + 0.2})`;
      ctx.fillRect(l.x - 22, b.y + 20, 44, H);
      ctx.fillStyle = `rgba(255,220,220,${0.8 * k + 0.2})`;
      ctx.fillRect(l.x - 8, b.y + 20, 16, H);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  // 血條
  if (!b.dead && b.mode === 'fight') {
    ctx.fillStyle = '#1C2340';
    ctx.fillRect(90, 60, 300, 8);
    ctx.fillStyle = b.hp < b.max / 2 ? '#FF3B3B' : '#FF9F1C';
    ctx.fillRect(90, 60, 300 * b.hp / b.max, 8);
    ctx.font = `bold 11px ${FONT_EN}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#F4F1E8';
    ctx.fillText('QUEEN', W / 2, 56);
  }
}

function drawPlayer() {
  const p = player;
  if (!p || p.dead) return;
  if (p.inv > 0 && Math.floor(T * 14) % 2 === 0) return;  // 無敵閃爍
  // 噴射火焰
  ctx.globalCompositeOperation = 'lighter';
  const fl = rand(6, 12);
  ctx.fillStyle = '#FF6B5A';
  ctx.fillRect(p.x - 5, p.y + 10, 3, fl);
  ctx.fillRect(p.x + 2, p.y + 10, 3, fl);
  ctx.fillStyle = '#FFC83D';
  ctx.fillRect(p.x - 4, p.y + 10, 1, fl * 0.6);
  ctx.fillRect(p.x + 3, p.y + 10, 1, fl * 0.6);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(p.y));
  ctx.transform(1, 0, p.tilt * 0.12, 1, 0, 0);
  ctx.drawImage(SHIP_IMG, -SHIP_IMG.width / 2, -SHIP_IMG.height / 2);
  ctx.restore();
  if (p.shield) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(79,195,232,${0.5 + 0.3 * Math.sin(T * 8)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, 21 + Math.sin(T * 6), 0, Math.PI * 2); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    ctx.fillStyle = 'rgba(255,200,61,0.35)';
    ctx.fillRect(b.x - 3, b.y - 2, 6, 16);
    ctx.fillStyle = '#FFF3C4';
    ctx.fillRect(b.x - 1, b.y, 3, 10);
  }
  for (const b of ebullets) {
    ctx.fillStyle = b.c;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(b.x - 1, b.y - 1, 2, 2);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawMeteors() {
  for (const m of meteors) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.fillStyle = m.flash > 0 ? '#FFFFFF' : '#7A6450';
    ctx.strokeStyle = '#C9B8A0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    m.pts.forEach((r, i) => {
      const a = i / m.pts.length * Math.PI * 2;
      if (i) ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    // 火尾
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,120,40,0.25)';
    ctx.fillRect(m.x - 3, m.y - m.r - 18, 6, 18);
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawDrops() {
  for (const d of drops) {
    const info = DROPS[d.k];
    const y = d.y + Math.sin(d.t * 6) * 2;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = info.c;
    ctx.globalAlpha = 0.25 + 0.15 * Math.sin(d.t * 10);
    ctx.beginPath(); ctx.arc(d.x, y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0F1428';
    ctx.strokeStyle = info.c;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(d.x, y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = info.c;
    ctx.font = `bold ${info.label.length > 1 ? 8 : 12}px ${FONT_EN}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(info.label, d.x, y + 1);
    ctx.textBaseline = 'alphabetic';
  }
}

function drawFx() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.c;
    if (p.type === 'debris') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz);
      ctx.restore();
    } else if (p.type === 'trail') {
      ctx.globalAlpha = k * 0.4;
      ctx.fillRect(p.x - 1, p.y - 1, p.sz, p.sz);
    } else {
      ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
    }
  }
  for (const r of rings) {
    const k = r.t / r.life;
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = r.c;
    ctx.lineWidth = r.w || 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r, r.max, k), 0, Math.PI * 2); ctx.stroke();
  }
  if (bombWave) {
    ctx.globalAlpha = Math.max(0, 1 - bombWave.r / 760);
    ctx.strokeStyle = '#FFE066';
    ctx.lineWidth = 14;
    ctx.beginPath(); ctx.arc(bombWave.x, bombWave.y, bombWave.r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bombWave.x, bombWave.y, bombWave.r * 0.92, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // 飄字
  ctx.textAlign = 'center';
  for (const t of texts) {
    const life = t.big ? 1.5 : 0.8;
    ctx.globalAlpha = 1 - t.t / life;
    ctx.fillStyle = t.c;
    ctx.font = t.tc ? `bold 14px ${FONT_TC}` : `bold ${t.big ? 24 : 12}px ${FONT_EN}`;
    ctx.fillText(t.s, t.x, t.y - t.t * 40);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textAlign = 'left';
  ctx.font = `bold 10px ${FONT_EN}`;
  ctx.fillStyle = '#FF6B5A';
  ctx.fillText('SCORE', 10, 16);
  ctx.font = `bold 16px ${FONT_EN}`;
  ctx.fillStyle = '#F4F1E8';
  ctx.fillText(String(score).padStart(7, '0'), 10, 33);

  ctx.textAlign = 'center';
  ctx.font = `bold 10px ${FONT_EN}`;
  ctx.fillStyle = '#FF6B5A';
  ctx.fillText('HI-SCORE', W / 2, 16);
  ctx.font = `bold 16px ${FONT_EN}`;
  ctx.fillStyle = '#FFC83D';
  ctx.fillText(String(Math.max(hi, score)).padStart(7, '0'), W / 2, 33);

  // 右上角：剩餘生命（小飛船）
  for (let i = 0; i < lives; i++) ctx.drawImage(SHIP_MINI, W - 22 - i * 18, 8);
  // 炸彈數
  for (let i = 0; i < bombs; i++) {
    ctx.fillStyle = '#FF9F1C';
    ctx.beginPath(); ctx.arc(W - 15 - i * 14, 30, 4, 0, Math.PI * 2); ctx.fill();
  }

  // 左下：關卡
  ctx.textAlign = 'left';
  ctx.font = `bold 12px ${FONT_EN}`;
  ctx.fillStyle = '#8A91AD';
  ctx.fillText('STAGE ' + stage, 10, H - 12);
  if (mod) {
    ctx.font = `bold 12px ${FONT_TC}`;
    ctx.fillStyle = '#FFC83D';
    ctx.fillText(mod.name, 74, H - 12);
  }
  // 右下：道具剩餘時間
  let y = H - 14;
  const bar = (label, v, max, c) => {
    ctx.fillStyle = c;
    ctx.font = `bold 10px ${FONT_EN}`;
    ctx.textAlign = 'right';
    ctx.fillText(label, W - 76, y + 4);
    ctx.fillStyle = '#1C2340';
    ctx.fillRect(W - 70, y - 3, 60, 6);
    ctx.fillStyle = c;
    ctx.fillRect(W - 70, y - 3, 60 * v / max, 6);
    y -= 12;
  };
  if (player) {
    if (player.double > 0) bar('DOUBLE', player.double, 12, '#FFC83D');
    if (player.rapid > 0) bar('RAPID', player.rapid, 10, '#FF6B5A');
    if (player.shield) bar('SHIELD', 1, 1, '#4FC3E8');
  }
  // 連擊
  if (combo >= 3 && comboT > 0) {
    ctx.textAlign = 'right';
    const s = 1 + comboPop * 0.5;
    ctx.save();
    ctx.translate(W - 12, 70);
    ctx.scale(s, s);
    ctx.font = `bold 16px ${FONT_EN}`;
    ctx.fillStyle = '#FF5AA8';
    ctx.fillText('COMBO x' + combo, 0, 0);
    ctx.restore();
  }
}

function drawBanner() {
  if (!banner) return;
  const b = banner;
  const a = Math.min(1, b.t / 0.25, (b.dur - b.t) / 0.3);
  const slide = (1 - Math.min(1, b.t / 0.3)) * 60;
  ctx.globalAlpha = Math.max(0, a);
  ctx.fillStyle = 'rgba(5,7,15,0.6)';
  ctx.fillRect(0, H / 2 - 52, W, 92);
  ctx.textAlign = 'center';
  ctx.font = `bold 36px ${FONT_EN}`;
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#05070f';
  ctx.strokeText(b.text, W / 2 - slide, H / 2 - 6);
  ctx.fillStyle = b.text === 'WARNING' && Math.floor(b.t * 6) % 2 ? '#FFFFFF' : b.color;
  ctx.fillText(b.text, W / 2 - slide, H / 2 - 6);
  ctx.font = `bold 16px ${FONT_TC}`;
  ctx.fillStyle = '#F4F1E8';
  ctx.fillText(b.sub, W / 2 + slide, H / 2 + 24);
  ctx.globalAlpha = 1;
}

function drawTitleText(text, y, size) {
  ctx.font = `bold ${size}px ${FONT_EN}`;
  ctx.textAlign = 'left';
  const total = ctx.measureText(text).width;
  let x = W / 2 - total / 2;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const w = ctx.measureText(ch).width;
    const yy = y + Math.sin(T * 3 + i * 0.5) * 5;
    const g = ctx.createLinearGradient(0, yy - size, 0, yy);
    g.addColorStop(0, '#FFF3C4'); g.addColorStop(0.5, '#FFC83D'); g.addColorStop(1, '#E0601E');
    ctx.lineWidth = 8; ctx.strokeStyle = '#05070f';
    ctx.strokeText(ch, x, yy);
    ctx.fillStyle = g;
    ctx.fillText(ch, x, yy);
    x += w;
  }
}

function drawTitle() {
  ctx.save();
  ctx.translate(0, Math.round((H - 640) / 2));  // 手機加高時，標題畫面置中
  drawTitleBody();
  ctx.restore();
}

function drawTitleBody() {
  // 裝飾用的飛行蜜蜂
  for (let i = 0; i < 6; i++) {
    const a = T * 0.6 + i * (Math.PI / 3);
    const x = W / 2 + Math.cos(a) * 190, y = 250 + Math.sin(a * 2) * 50;
    const key = ['worker', 'soldier', 'guard'][i % 3];
    const img = SPR[key][Math.floor(T * 6 + i) % 2];
    ctx.save(); ctx.translate(x, y);
    ctx.rotate(Math.atan2(Math.cos(a * 2) * 100, -Math.sin(a) * 190) - Math.PI / 2);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
  }
  drawTitleText('BEE STORM', 170, 56);
  ctx.textAlign = 'center';
  ctx.font = `bold 14px ${FONT_TC}`;
  ctx.fillStyle = '#4FC3E8';
  ctx.fillText('— 蜂 暴 —', W / 2, 200);

  if (Math.floor(T * 2) % 2 === 0) {
    ctx.font = `bold 22px ${FONT_TC}`;
    ctx.fillStyle = '#F4F1E8';
    ctx.fillText(touchMode ? '點一下開始' : '按 Enter 開始', W / 2, 360);
  }
  ctx.font = `13px ${FONT_TC}`;
  ctx.fillStyle = '#C9CFE3';
  if (touchMode) {
    ctx.fillText('手指左右拖曳移動　按住自動射擊', W / 2, 405);
    ctx.fillText('右下按鈕放炸彈　右上按鈕暫停', W / 2, 425);
  } else {
    ctx.fillText('← → 移動　空白鍵 射擊　X 炸彈', W / 2, 405);
    ctx.fillText('P 暫停　M 靜音', W / 2, 425);
  }

  // 道具說明
  const items = [['D', '雙發'], ['R', '連射'], ['S', '護盾'], ['B', '炸彈'], ['L', '1UP']];
  items.forEach(([k, name], i) => {
    const x = 80 + i * 80, y = 480;
    const info = DROPS[k];
    ctx.fillStyle = '#0F1428'; ctx.strokeStyle = info.c; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = info.c;
    ctx.font = `bold ${info.label.length > 1 ? 8 : 12}px ${FONT_EN}`;
    ctx.textBaseline = 'middle';
    ctx.fillText(info.label, x, y + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.font = `12px ${FONT_TC}`;
    ctx.fillStyle = '#C9CFE3';
    ctx.fillText(name, x, y + 28);
  });
  ctx.font = `12px ${FONT_TC}`;
  ctx.fillStyle = '#8A91AD';
  ctx.fillText('每 3 關蜂后登場　·　每 4 關獎勵關', W / 2, 545);

  ctx.font = `bold 12px ${FONT_EN}`;
  ctx.fillStyle = '#FFC83D';
  ctx.fillText('HI-SCORE ' + String(hi).padStart(7, '0'), W / 2, 590);
  ctx.font = `11px ${FONT_TC}`;
  ctx.fillStyle = '#5A6390';
  ctx.fillText('Vibe Coding × Antigravity 示範作品', W / 2, 620);
}

function drawGameOver() {
  ctx.fillStyle = `rgba(5,7,15,${Math.min(0.75, overT)})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const s = 1 + Math.max(0, 0.6 - overT) * 2;
  ctx.save();
  ctx.translate(W / 2, 250);
  ctx.scale(s, s);
  ctx.font = `bold 48px ${FONT_EN}`;
  ctx.lineWidth = 8; ctx.strokeStyle = '#05070f';
  ctx.strokeText('GAME OVER', 0, 0);
  ctx.fillStyle = '#FF3B3B';
  ctx.fillText('GAME OVER', 0, 0);
  ctx.restore();
  ctx.font = `bold 16px ${FONT_TC}`;
  ctx.fillStyle = '#F4F1E8';
  ctx.fillText(`最終分數　${score}`, W / 2, 310);
  ctx.fillStyle = '#8A91AD';
  ctx.fillText(`到達第 ${stage} 關`, W / 2, 338);
  if (newRecord && Math.floor(T * 4) % 2 === 0) {
    ctx.fillStyle = '#FFC83D';
    ctx.font = `bold 20px ${FONT_TC}`;
    ctx.fillText('新紀錄！NEW RECORD', W / 2, 380);
  }
  if (overT > 1 && Math.floor(T * 2) % 2 === 0) {
    ctx.font = `bold 18px ${FONT_TC}`;
    ctx.fillStyle = '#F4F1E8';
    ctx.fillText(touchMode ? '點一下重新開始' : '按 Enter 重新開始', W / 2, 440);
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
  drawBackground();
  if (state !== 'title') {
    drawDrops();
    drawMeteors();
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBoss();
    drawBullets();
    drawPlayer();
  }
  drawFx();
  ctx.restore();

  if (state === 'title') drawTitle();
  else {
    drawHUD();
    if (touchMode && state === 'play' && !paused) drawTouchUI();
    drawBanner();
    if (state === 'over') drawGameOver();
    if (paused) {
      ctx.fillStyle = 'rgba(5,7,15,0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = `bold 32px ${FONT_EN}`;
      ctx.fillStyle = '#F4F1E8';
      ctx.fillText('PAUSED', W / 2, H / 2);
      ctx.font = `14px ${FONT_TC}`;
      ctx.fillText(touchMode ? '點一下繼續' : '按 P 繼續', W / 2, H / 2 + 30);
      if (touchMode) {
        const b = BTN.mute;
        ctx.strokeStyle = '#8A91AD'; ctx.lineWidth = 2;
        ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
        ctx.fillStyle = '#C9CFE3';
        ctx.fillText(muted ? '開啟聲音' : '關閉聲音', b.x, b.y + 5);
      }
    }
  }
  if (flashA > 0) {
    ctx.globalAlpha = flashA;
    ctx.fillStyle = flashC;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(OVERLAY, 0, 0);
  if (muted) {
    ctx.textAlign = 'right';
    ctx.font = `10px ${FONT_EN}`;
    ctx.fillStyle = '#8A91AD';
    ctx.fillText('MUTE', W - 10, H - 30);
  }
}

// ---------- 輸入 ----------
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  initAudio();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.35; }
  if (e.code === 'Enter' || e.code === 'NumpadEnter') {
    if (state === 'title') startGame();
    else if (state === 'over' && overT > 1) startGame();
  }
  if (state === 'play') {
    if (e.code === 'KeyP') paused = !paused;
    if (e.code === 'KeyX' || e.code === 'KeyB') useBomb();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  touch.id = null;
  if (state === 'play' && touchMode) paused = true;
});
// 手機在標題畫面轉向時，重新載入以換成適合的畫面比例（遊戲中不打斷）
addEventListener('resize', () => {
  if (!touchMode || state !== 'title') return;
  const want = innerHeight <= innerWidth ? 640 : Math.round(Math.min(960, Math.max(640, W * innerHeight / innerWidth)));
  if (Math.abs(want - H) > 40) location.reload();
});
// 切到別的 App 或關螢幕時自動暫停
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') paused = true;
});

// ---------- 手機觸控 ----------
const touch = { id: null, lastX: 0, dx: 0, used: false };
const BTN = {
  bomb:  { x: W - 46, y: H - 112, r: 30 },
  pause: { x: W - 26, y: 100, r: 16 },
  mute:  { x: W / 2, y: H / 2 + 90, w: 140, h: 40 },
};
let bombPress = 0;

function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* 不支援震動就算了 */ }
}
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const near = (p, b, extra) => Math.hypot(p.x - b.x, p.y - b.y) < b.r + extra;

addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;  // 電腦維持用鍵盤
  e.preventDefault();
  touchMode = true;
  initAudio();
  const p = toGame(e);
  if (state === 'title') { startGame(); touch.dx = 0; return; }
  if (state === 'over') { if (overT > 1) { startGame(); touch.dx = 0; } return; }
  if (paused) {
    const m = BTN.mute;
    if (Math.abs(p.x - m.x) < m.w / 2 && Math.abs(p.y - m.y) < m.h / 2) {
      muted = !muted;
      if (master) master.gain.value = muted ? 0 : 0.35;
    } else paused = false;
    return;
  }
  if (near(p, BTN.pause, 14)) { paused = true; touch.id = null; return; }
  if (near(p, BTN.bomb, 10)) { useBomb(); bombPress = 0.2; buzz(60); return; }
  if (touch.id === null) { touch.id = e.pointerId; touch.lastX = p.x; }
}, { passive: false });

addEventListener('pointermove', e => {
  if (e.pointerId !== touch.id) return;
  e.preventDefault();
  const p = toGame(e);
  if (!paused && state === 'play') {
    touch.dx += (p.x - touch.lastX) * 1.3;  // 稍微放大，手指不用移太遠
    touch.used = true;
  }
  touch.lastX = p.x;
}, { passive: false });

const endTouch = e => { if (e.pointerId === touch.id) touch.id = null; };
addEventListener('pointerup', endTouch);
addEventListener('pointercancel', endTouch);
addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('touchend', () => initAudio());  // iOS 要在手勢內喚醒音效
addEventListener('contextmenu', e => e.preventDefault());

function drawTouchUI() {
  bombPress = Math.max(0, bombPress - 1 / 60);
  // 炸彈按鈕
  const b = BTN.bomb;
  const on = bombs > 0;
  ctx.globalAlpha = on ? 0.85 : 0.35;
  ctx.fillStyle = bombPress > 0 ? 'rgba(255,159,28,0.6)' : 'rgba(28,35,64,0.55)';
  ctx.strokeStyle = '#FF9F1C';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFE7A3';
  ctx.font = `bold 13px ${FONT_TC}`;
  ctx.fillText('炸彈', b.x, b.y + 1);
  ctx.font = `bold 12px ${FONT_EN}`;
  ctx.fillText('×' + bombs, b.x, b.y + 16);
  // 暫停按鈕
  const p = BTN.pause;
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = 'rgba(28,35,64,0.6)';
  ctx.strokeStyle = '#8A91AD';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#F4F1E8';
  ctx.fillRect(p.x - 5, p.y - 6, 3, 12);
  ctx.fillRect(p.x + 2, p.y - 6, 3, 12);
  ctx.globalAlpha = 1;
  // 第一次玩的提示
  if (!touch.used) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 5);
    ctx.font = `bold 15px ${FONT_TC}`;
    ctx.fillStyle = '#F4F1E8';
    ctx.fillText('← 按住螢幕左右拖曳 →', W / 2, H - 110);
    ctx.globalAlpha = 1;
  }
}

// ---------- 遊戲迴圈 ----------
let last = performance.now();
let dbgT = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);  // 第一格的時間戳可能比 last 早，不能變負數
  last = now;
  T += dt;
  if (state === 'play' && !paused) {
    if (hitStop > 0) hitStop -= dt;
    else {
      const ts = slowMo > 0 ? 0.35 : 1;
      slowMo = Math.max(0, slowMo - dt);
      update(dt * ts);
    }
  }
  if (AUTO && state === 'over' && overT > 1.2) startGame();
  updateAmbient(dt);
  render();
  if (AUTO) {
    dbgT += dt;
    if (dbgT > 0.5) {
      dbgT = 0;
      document.getElementById('dbg').textContent = JSON.stringify({
        state, phase, stage, score, lives, bombs, enemies: enemies.length,
        boss: boss ? boss.hp : null, bonusHits: bonus ? bonus.hits : null,
        kills: stats.kills, maxStage: stats.maxStage, games: stats.games, t: +T.toFixed(1), errors,
      });
    }
  }
  if (AUTO) setTimeout(() => frame(performance.now()), 16); else requestAnimationFrame(frame);
}
if (AUTO) startGame();
if (AUTO) setTimeout(() => frame(performance.now()), 16); else requestAnimationFrame(frame);
</script>
</body>
</html>
